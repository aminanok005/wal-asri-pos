openapi: 3.0.3

info:
  title: GreenTable POS API
  version: 0.1.0
  description: |
    Contract-first source of truth for the GreenTable POS ecosystem.

    This file is hand-edited (SKILL.md §4 Step 1). TypeScript types are GENERATED
    from it into `packages/api-types/src/index.ts` by `openapi-typescript` and
    must never be edited by hand.

    ## Money rule — Satang (decimal string)

    Every monetary field in this contract is a **whole number of satang carried
    as a JSON string**, e.g. `"4550"`. 1 Baht = 100 satang, so ฿45.50 is
    `"4550"`. There is **no float, no decimal point, and no currency symbol on
    the wire**. A field whose name ends in `_satang` always holds this value.

    Rationale: `3 × 0.1 = 0.30000000000000004`. A POS that drifts a fraction of
    a satang per line item cannot reconcile at end of shift. Integer satang
    makes that class of error unrepresentable.

    **Why a string and not `type: integer`.** JSON has exactly one number type,
    and IEEE-754 doubles carry integers exactly only up to 2^53 - 1. A bare
    satang literal would reach JavaScript as a `number`, making precision loss a
    property of the *type* rather than a rule the caller must remember.
    Quoting the digits takes the value out of the number type entirely, so
    TypeScript binds it as `string` and the `bigint` conversion inside the
    `Money` value object is the only way to do arithmetic on it.

    This is a **unification, not a new convention.** Three readers already
    refuse anything but canonical digits, and all of them enforce
    `^(0|[1-9][0-9]*)$`, which rejects `-1`, `+1`, `007`, `1.0` and `" 1"`:

      * `parse_satang` in `apps/pos-desktop/src-tauri/src/commands.rs`
      * `SATANG_PATTERN` in
        `apps/pos-desktop/src/features/sales/infrastructure/tauriOfflineOrders.ts`
      * the `typeof(...) = 'integer'` column CHECKs in
        `apps/pos-desktop/src-tauri/migrations/0001_init.sql`

    `Satang` below states that pattern in the contract instead of leaving it as
    an unwritten implementation detail, so a generated client validates exactly
    what the terminal's disk layer already rejects.

    **The one signed money field.** `rounding_adjustment_satang` is the single
    exception to the pattern above, and it is signed on purpose. Cash rounding
    rounds the amount charged to the nearest value actually payable from the
    drawer, and that value can sit on *either* side of the exact total — ฿45.53
    may round up to ฿45.55 or down to ฿45.50. A non-negative field could only
    express half of that. See `SignedSatang` and the arithmetic caveat recorded
    on `Order`.

    ## Identifiers — UUIDv7

    All `id` fields are UUIDv7, generated **client-side**. A terminal must be
    able to create a record while offline and still produce an identifier that
    sorts chronologically and does not collide across devices.

    ## Optimistic concurrency and sync

    Every primary entity carries BOTH:
      * `updated_at` — when the row last changed (RFC 3339, UTC).
      * `version`    — incremented by the server on every write.

    `version` is what a client sends back to detect a lost update.
    `updated_at` is what a client uses as a **sync cursor** — see
    `GET /catalog?since=` and `GET /inventory/balances?since=`.

    ## Scoping — branch and terminal

    Reads are scoped by `branch_id`, because catalog and pricing are
    branch-specific (each branch has its own price list and VAT rate). Writes
    are additionally scoped by the authenticated terminal, which the server
    derives from the device credential — a client never asserts its own
    terminal identity.

    ## Status vocabulary

    `is_active` is a **boolean** and is the single source of truth for
    "available to sell". A separate `status` field exists only on entities
    where DOMAIN.md defines a real state machine (see `OrderStatus`,
    `OutboxStatus`). Catalog entities do not have one.

    ⚠️ Implementation note: the server that implements this contract lives in
    `services/api-backend`, which is BLOCKED on the `grit` CLI. Steps 1-2
    (contract + generated types) are unaffected and can proceed; Step 3
    (server implementation) cannot. Do not substitute another framework.

servers:
  - url: /api/v1
    description: Relative — the client is a Tauri app on the same LAN.

tags:
  - name: Catalog
    description: Sellable items and their prices. Pulled down for local cache.
  - name: Inventory
    description: Stock levels per branch. Read-only on the client.
  - name: Orders
    description: |
      Committed sales. Read-only over HTTP by design — a committed sale is never
      restated in place, so corrections are a void or a refund, not an update.
  - name: Sync
    description: |
      The offline drain. A terminal records events locally and pushes them when the
      network returns; this is the endpoint that makes an offline sale real.

paths:
  # ==========================================================================
  # Catalog
  # ==========================================================================
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Get the full sellable catalog
      description: |
        Returns every category, product, variant and active price-list entry
        for a branch, so the POS terminal can populate its local SQLite cache.

        This is the read that replaces a network call on the sell path. Once
        cached, the UI reads only from local SQLite and never blocks on the
        network (`ARCHITECTURE-DEMO.md` §4, "Sync Down").

        **Incremental pull.** Pass `since` (an RFC 3339 timestamp) to receive
        only rows changed after that instant, plus a new `cursor`. A terminal
        that has never synced omits `since` and receives the full catalog.

        **Server wins on price.** Catalog and prices are last-write-wins by
        `version` — a client may not originate a price change
        (`ARCHITECTURE-DEMO.md` §9, "Conflict rules").
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The catalog snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==========================================================================
  # Inventory
  # ==========================================================================
  /inventory/balances:
    get:
      tags: [Inventory]
      operationId: getInventoryBalances
      summary: Get stock balances for a branch
      description: |
        Returns the current `StockBalance` for every tracked inventory item in
        a branch.

        **Quantities are decimal, not money, and are carried as strings.**
        `on_hand` is `decimal(12,3)` in the data model because a balance can be
        `2.500` kg of flour. A JSON number would force binary floating point
        onto an exact decimal, which is the same class of error the satang
        rule exists to prevent — so the value travels as a **string** and the
        client parses it. See `Quantity` in components/schemas.

        **`on_hand` is derived, never written by the client.** It is computed
        server-side from the `StockMovement` ledger. Stock is a ledger of
        movements, not an overwritten number (`ARCHITECTURE-DEMO.md` §9). This
        endpoint is read-only; there is deliberately no `PUT` or `PATCH`.
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ItemFilter'
      responses:
        '200':
          description: Current stock balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBalancesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Fetch one order
      description: |
        Returns a single order by id, with its lines and payments.

        The id is the **terminal-generated UUIDv7**, not a server sequence. A sale
        taken while offline must be fetchable by the identifier it already has, and
        a server-assigned id would leave an offline order permanently unaddressable
        until sync — which is precisely when a manager needs to see it.

        Read-only by design. There is no `PUT` or `PATCH` here: a committed sale is
        never restated in place. The terminal's own immutability trigger enforces
        that locally, and a write endpoint here would let a remote caller violate a
        rule the client is already forbidden to break. Corrections are new orders,
        or a void, or a refund.

        **`status` and `lifecycle_status` are both present.** `status` is the
        three-value settled enum; `lifecycle_status` is the full eight-state
        preparation ladder. Reading only `status` would make an order that is
        merely `submitted` indistinguishable from one that does not exist.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: The order, with lines and payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/push:
    post:
      tags: [Sync]
      operationId: pushSyncCommands
      summary: Drain a terminal's outbox
      description: |
        Accepts a batch of events recorded while the terminal was offline and
        applies them, then reports what happened to each one.

        **The `Idempotency-Key` header is required.** A terminal that loses the
        response to a successful push retries the identical batch, so without this
        key a lost response means every sale in the batch is applied twice.

        **Commands are applied in array order and must not be reordered.** The
        terminal's outbox is an `AUTOINCREMENT` sequence, and replaying a
        `shift_opened` after the `shift_closed` that ended it would corrupt the
        till's day. Order is therefore semantic here, not incidental.

        **One bad command does not fail the batch.** Each command carries its own
        outcome in the response, because a terminal that loses a whole batch to one
        malformed event can never drain that batch again — it will fail the same
        way forever. Only a malformed *envelope* fails the request as a whole.

        **No authentication in this revision.** `terminal_id` is client-asserted
        and unverified, so this endpoint will accept events from a caller that has
        not proved it owns that terminal. It is specified and implemented now
        because the offline drain is the system's load-bearing path, but the
        `401`/`403` responses below are aspirational: no credential is checked
        yet. Do not expose this route publicly before device credentials land.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: |
            The batch was processed. Inspect each result to see what happened;
            `200` means the request was well-formed, not that every command
            was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==========================================================================
  # Reporting (Phase 1 — read-only analytics)
  # ==========================================================================

  /branches:
    get:
      tags: [Reporting]
      operationId: getBranches
      summary: List branches
      description: |
        Returns every branch. This is read-only; branches are created and managed
        by an administrator, not by terminals.

        **Auth stub (Phase 1):** `REPORTS_TOKEN` environment variable required,
        `X-Report-Token` header must match, and the caller must be localhost.
        Without these, 503 with code `auth_stub_required`.
      responses:
        '200':
          description: List of branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Auth stub not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /terminals:
    get:
      tags: [Reporting]
      operationId: getTerminals
      summary: List terminals with last sync time
      description: |
        Returns every terminal that has pushed orders or has records in the sync
        outbox, with the last time it successfully synced.

        **Auth stub (Phase 1):** Same as `/branches`.

        **Derived fields:** `last_sync_at` is computed from `sync_outbox_items`
        as `MAX(processed_at)` where `state IN ('ACKNOWLEDGED', 'CONFLICT_HELD')`.
        A terminal that only exists in `orders.terminal_id` but never pushed to
        the outbox will have `null` for `last_sync_at`.
      responses:
        '200':
          description: List of terminals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Auth stub not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/summary:
    get:
      tags: [Reporting]
      operationId: getReportSummary
      summary: Revenue summary
      description: |
        Returns total revenue (VAT-inclusive), VAT amount, order count, and
        voided count for a branch within a date range.

        **Revenue definition:**
        - Excludes `draft` status orders
        - Excludes `voided` status orders
        - Includes `void_requested` orders (committed sales awaiting void decision)

        **Time bucketing:** Dates are interpreted in `Asia/Bangkok` timezone.
        `as_of` is the latest `created_at` of counted orders (UTC).

        **Auth stub (Phase 1):** Same as `/branches`.
      parameters:
        - name: branch_id
          in: query
          required: true
          description: Branch to report on.
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: from
          in: query
          required: true
          description: Start date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: End date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-31'
      responses:
        '200':
          description: Revenue summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Auth stub not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/revenue-by-branch:
    get:
      tags: [Reporting]
      operationId: getRevenueByBranch
      summary: Revenue broken down by branch
      description: |
        Returns revenue and order count per branch, ordered by revenue descending.

        **Revenue definition:** Same as `/reports/summary`.

        **Auth stub (Phase 1):** Same as `/branches`.
      parameters:
        - name: from
          in: query
          required: true
          description: Start date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: End date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-31'
      responses:
        '200':
          description: Revenue by branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueByBranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Auth stub not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/revenue-series:
    get:
      tags: [Reporting]
      operationId: getRevenueSeries
      summary: Revenue time series
      description: |
        Returns revenue and order count aggregated by day or month.

        **Revenue definition:** Same as `/reports/summary`.

        **Auth stub (Phase 1):** Same as `/branches`.
      parameters:
        - name: branch_id
          in: query
          required: true
          description: Branch to report on.
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: granularity
          in: query
          required: true
          description: Time bucket size.
          schema:
            type: string
            enum: [day, month]
            example: day
        - name: from
          in: query
          required: true
          description: Start date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: to
          in: query
          required: true
          description: End date (inclusive, Asia/Bangkok).
          schema:
            type: string
            format: date
            example: '2026-10-31'
      responses:
        '200':
          description: Revenue time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Auth stub not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  # ==========================================================================
  # Reusable parameters
  # ==========================================================================
  parameters:
    BranchId:
      name: branch_id
      in: query
      required: true
      description: |
        Branch whose catalog and stock are being requested. Required because
        pricing and VAT are branch-specific.
      schema:
        $ref: '#/components/schemas/UuidV7'
      example: 018f3c2a-7b41-7c3d-9e10-5a2b8c4d6e01

    Since:
      name: since
      in: query
      required: false
      description: |
        Sync cursor — an RFC 3339 timestamp. When present, only rows with
        `updated_at` strictly greater than this value are returned. Omit for a
        full snapshot. Always use the `cursor` from the previous response.
      schema:
        type: string
        format: date-time
      example: '2026-10-02T09:15:00Z'

    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous response's `next_cursor`.
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Server caps the maximum.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 200

    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      description: |
        Include rows where `is_active` is false. Omit or set false to receive
        only sellable items.
      schema:
        type: boolean
        default: false

    ItemFilter:
      name: inventory_item_ids
      in: query
      required: false
      description: |
        Comma-separated inventory item IDs to restrict the response to. Omit
        for every tracked item in the branch.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/UuidV7'
      style: form
      explode: false

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Replay-safety key for the **whole drain attempt**.

        Required, not optional, because the failure this prevents is not a rare
        race: a terminal that loses the response to a successful push will retry
        the identical batch, and without this key every command in it is applied
        twice. That double-books a sale the customer was already charged for.

        Deliberately a *header* rather than a body field. The server must be able
        to reject a duplicate batch **before parsing the body**; a key that can
        arrive inside the payload only after a multi-megabyte upload has been
        received and parsed cannot prevent the work it exists to prevent.

        This is distinct from each command's own `idempotency_key`, which dedupes
        one event. The two levels are not redundant: the header stops a whole
        batch being reprocessed, the per-command key stops a single event being
        applied twice when two *different* batches overlap.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: a3f1c7e2-9d64-4b0a-9f31-6c2d5e7a1b48

    OrderId:
      name: id
      in: path
      required: true
      description: |
        The order to fetch. A UUIDv7, so it is the same identifier the terminal
        generated offline — a server-assigned id would make this lookup useless
        for the exact case it exists to serve, an order created with no network.
      schema:
        $ref: '#/components/schemas/UuidV7'

  # ==========================================================================
  # Reusable responses
  # ==========================================================================
  responses:
    BadRequest:
      description: Malformed or missing parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No device credential, or the refresh token has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The device credential is valid but is not scoped to the requested
        branch. The server never trusts a client-asserted branch id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        No such order.

        Also returned when the order exists but belongs to a branch the calling
        credential is not scoped to. A distinct `403` would leak the existence of
        another branch's sales to a terminal that cannot read them, so the server
        answers `404` for both and logs the real reason server-side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        example:
          code: order_not_found
          message: No order with that id in this branch.

  # ==========================================================================
  # Schemas
  # ==========================================================================
  schemas:

    # ── Primitives ──────────────────────────────────────────────────────────

    UuidV7:
      type: string
      format: uuid
      description: |
        UUIDv7, generated **client-side** so a record can be created offline.
        Time-ordered: sorts chronologically, which is what makes it usable as
        a primary key on a device that may sync out of order.
      example: 018f3c2a-7b41-7c3d-9e10-5a2b8c4d6e01

    Satang:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: |
        **MONEY — Satang (whole satang, quoted digits).** A count of satang
        carried as a string. 1 Baht = 100 satang, so ฿45.50 is `"4550"`.

        Never a float, never a decimal point, never a currency symbol, never a
        bare JSON number. Two decimal places of *major* currency are already
        carried by the scale factor of 100; a value of `"1250"` means ฿12.50
        unambiguously.

        The pattern admits **canonical non-negative digits only**. It rejects
        `"-1"` (sign), `"+1"` (explicit plus), `"007"` (leading zeros), `"1.0"`
        (decimal point), `" 1"` (whitespace) and `""` (empty). Each of those
        rejections is load-bearing: two clients that disagree about whether
        `"007"` is 7 satang will disagree about a customer's total at close.

        String typing is what makes that guarantee enforceable. As
        `type: integer` the schema would admit `"1.5"` and `1e3` implicitly via
        JSON Schema's numeric coercion; as a string the pattern above is exact.

        Range: ฿90 trillion is 2^53 satang, far beyond any single transaction
        here, but the string form has no upper bound and no rounding at any
        size.
      example: '4550'

    SignedSatang:
      type: integer
      format: int64
      description: |
        **MONEY — signed satang, for cash rounding only.** The one money field
        in this contract that may be negative, used exclusively for
        `rounding_adjustment_satang`.

        Deliberately typed `integer`/`int64` rather than as a `Satang` string.
        Rounding to the nearest payable denomination is a genuinely signed
        operation: ฿45.53 can round *up* to ฿45.55 or *down* to ฿45.50, and a
        `Satang` pattern would make the down case unrepresentable, forcing the
        client to lie about the direction of the adjustment in order to keep the
        sign. Negative is written with a leading `-` and no `+` form.

        There is **no `minimum`** here, unlike every other money field, and that
        absence is the whole point of the exception.

        The single bound that does apply is on the *total*, not on this field:
        `total_satang >= 0`. Rounding may move the amount charged down, but it may
        not make the sale negative, because a refund in this system is a separate
        document rather than an order that costs the customer money. That is
        enforced by `CHECK (total_satang >= 0)` in
        `0002_signed_rounding.sql`, which is the migration that dropped
        `rounding_adjustment_satang >= 0` in the first place.

        Note for a reader arriving from the signed-rounding migration: Rust's
        `parse_satang` and the terminal's `SATANG_PATTERN` both still apply
        `^(0|[1-9][0-9]*)$` to every `*_satang` field they read, with no signed
        exception yet. A negative adjustment is therefore still refused at the
        terminal's own boundary before it reaches this endpoint. That gap is on
        the client side, not in this schema.
      example: -3

    Quantity:
      type: string
      pattern: '^-?\d+(\.\d{1,3})?$'
      description: |
        **QUANTITY — exact decimal as a string, up to 3 decimal places.**
        Matches `decimal(12,3)` in the data model.

        Carried as a **string, not a JSON number**, on purpose. A quantity is a
        ratio, not money, so it legitimately needs a decimal point (`2.500` kg),
        but a JSON number would place that value in binary floating point —
        the same drift the satang rule forbids for money. As a string it
        round-trips exactly and is parsed into a scaled integer by the client.

        A leading `-` is permitted: a balance may go negative when an offline
        terminal oversells stock, and the server reconciles it later
        (`ARCHITECTURE-DEMO.md` §9).
      example: '2.500'

    Version:
      type: integer
      format: int64
      minimum: 0
      description: |
        Optimistic-concurrency counter. The server increments it on every
        write. A client performing a conditional write sends the `version` it
        read; a mismatch is a conflict, never a silent overwrite.

        `PriceList` already carries a `version` field in the data model with
        the same meaning; it is exposed here for every primary entity so a
        client can apply one rule everywhere.
      example: 7

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 code. Read from the owning `Branch`, never asserted by the client.
      example: THB

    # ── Catalog ─────────────────────────────────────────────────────────────

    Category:
      type: object
      description: |
        A menu grouping. Hierarchical via `parent_id` (self-referencing), e.g.
        Beverage → Coffee → Espresso.
      required:
        - id
        - branch_id
        - name_th
        - is_active
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        name_th:
          type: string
          maxLength: 255
          description: Thai display name. The primary label in this product.
          example: เครื่องดื่ม
        name_en:
          type: string
          maxLength: 255
          nullable: true
          description: English display name. Optional.
          example: Beverages
        parent_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: Parent category. `null` for a root category.
        sequence:
          type: integer
          format: int32
          default: 0
          description: Manual sort order within the parent. Lower sorts first.
        is_active:
          type: boolean
          description: Whether the category is shown to staff. Not the same as "has sellable items".
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    Product:
      type: object
      description: |
        A sellable concept, e.g. "Iced Latte". Prices live on
        `ProductVariant`, never on the product itself — a product with several
        sizes has several variants at different prices.
      required:
        - id
        - branch_id
        - name_th
        - is_active
        - is_combo
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        category_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: Owning category. `null` for an uncategorised product.
        name_th:
          type: string
          maxLength: 255
          description: Thai display name.
          example: กาแฟลาเต้เย็น
        name_en:
          type: string
          maxLength: 255
          nullable: true
          description: English display name. Optional.
        is_active:
          type: boolean
          description: |
            Whether the product is sellable. `false` retires it from the menu
            but keeps it valid on historical orders, which are append-only.
        is_combo:
          type: boolean
          description: |
            When `true` the product is assembled from other variants via
            `ComboComponent`, and selling it also consumes their stock.
        recipe_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: |
            Recipe used for ingredient consumption. `null` for a product with
            no tracked recipe.
        image_url:
          type: string
          format: uri
          nullable: true
          description: Optional image location.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    ProductVariant:
      type: object
      description: |
        A concrete sellable SKU of a product — the row that carries a price and
        a stock balance. "Iced Latte" (product) has variants for 12 oz, 16 oz,
        each with its own `PriceListEntry`.
      required:
        - id
        - product_id
        - sku
        - name_th
        - is_active
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        product_id:
          $ref: '#/components/schemas/UuidV7'
        sku:
          type: string
          maxLength: 100
          description: Stock-keeping unit. Unique per branch.
          example: BEV-LATTE-12
        barcode:
          type: string
          maxLength: 64
          nullable: true
          description: |
            Scannable barcode. Not present in the current data model —
            **additive, pending approval** (see D-BARCODE). Optional and
            nullable so its absence never breaks deserialisation.
          example: '8851000000000'
        name_th:
          type: string
          maxLength: 255
          description: Thai variant name, e.g. the size.
          example: 12 ออนซ์
        name_en:
          type: string
          maxLength: 255
          nullable: true
          description: English variant name. Optional.
        size:
          type: string
          maxLength: 100
          nullable: true
          description: Free-form size label for display, e.g. "12 oz".
        image_url:
          type: string
          format: uri
          nullable: true
          description: Optional image location. Defaults to the parent product's.
        is_active:
          type: boolean
          description: |
            Whether the variant is sellable. A variant can be retired while its
            product stays active, e.g. a seasonal size.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    PriceListEntry:
      type: object
      description: |
        The **price of one variant** under one price list. This is the only
        place a sell price appears in the contract.

        A variant may appear in more than one price list (e.g. standard and
        promotional); the client resolves which list is active for the branch.
      required:
        - id
        - price_list_id
        - product_variant_id
        - unit_price_satang
        - currency_code
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        price_list_id:
          $ref: '#/components/schemas/UuidV7'
        product_variant_id:
          $ref: '#/components/schemas/UuidV7'
        unit_price_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            **MONEY — Satang.** Price for one unit, before tax and before
            discount. ฿45.50 is `"4550"`.

            Promotions do not modify this value. A discount is a separate
            resolved amount applied at checkout, so the list price stays
            comparable across periods.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    # ── Inventory ───────────────────────────────────────────────────────────

    InventoryItem:
      type: object
      description: |
        A stock-keeping article. Points at a `ProductVariant` when the article
        is itself sellable, and at nothing when it is a raw ingredient
        (`is_raw: true`) consumed only through a recipe.
      required:
        - id
        - branch_id
        - name_th
        - unit
        - track_stock
        - is_raw
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        product_variant_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: |
            The sellable variant this item represents. `null` when
            `is_raw` is true (an ingredient with no direct sale).
        sku:
          type: string
          maxLength: 100
          description: Stock-keeping unit for this article.
          example: ING-FLOUR-001
        name_th:
          type: string
          maxLength: 255
          description: Thai name of the article.
          example: แป้งเปียก
        name_en:
          type: string
          maxLength: 255
          nullable: true
          description: English name. Optional.
        unit:
          type: string
          maxLength: 50
          description: |
            **Free-text unit of measure**, e.g. `kg`, `g`, `ml`, `pcs`.

            ⚠️ This is a plain string in the current data model, which cannot
            prevent a recipe from mixing `kg` with `g`. A `unit_of_measure_id`
            foreign key is the durable fix and is **proposed, not approved**
            (see D-UNIT). Until then the server must validate unit consistency
            on write; the client must not attempt to convert between units.
          example: kg
        track_stock:
          type: boolean
          description: |
            Whether a `StockBalance` is maintained for this item. `false` for
            items that are never counted, e.g. a garnish.
        is_raw:
          type: boolean
          description: |
            `true` for a raw ingredient consumed via a recipe; `false` for a
            finished good sold directly.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    StockBalance:
      type: object
      description: |
        The derived quantity of one inventory item on hand at one branch.

        **Derived, never written by a client.** It is computed server-side from
        the `StockMovement` ledger. Stock is a ledger of movements rather than
        an overwritten number, precisely so that history survives and offline
        writes can be reconciled (`ARCHITECTURE-DEMO.md` §9).
      required:
        - id
        - inventory_item_id
        - branch_id
        - on_hand
        - reserved
        - version
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        inventory_item_id:
          $ref: '#/components/schemas/UuidV7'
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        on_hand:
          allOf: [$ref: '#/components/schemas/Quantity']
          description: |
            **QUANTITY — exact decimal string, 3 dp.** Quantity physically on
            hand. May be negative if an offline terminal oversold before
            reconciling.
        reserved:
          allOf: [$ref: '#/components/schemas/Quantity']
          description: |
            **QUANTITY — exact decimal string, 3 dp.** Quantity committed to
            open orders but not yet deducted. Available-to-sell is
            `on_hand - reserved`.
        last_movement_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: The `StockMovement` that produced this balance. Lets a client verify the derivation.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC. Doubles as the sync cursor for this row.
      additionalProperties: false

    # ── Envelopes ───────────────────────────────────────────────────────────

    CatalogResponse:
      type: object
      description: |
        A catalog snapshot plus the cursor needed to ask for the next delta.
      required:
        - branch_id
        - categories
        - products
        - variants
        - price_list_entries
        - cursor
        - pulled_at
      properties:
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        price_list_entries:
          type: array
          items:
            $ref: '#/components/schemas/PriceListEntry'
        cursor:
          type: string
          description: |
            **Sync cursor.** Pass back as `since` to receive only what changed
            after this snapshot. Equal to the `pulled_at` of this response.
          example: '2026-10-02T09:15:00Z'
        pulled_at:
          type: string
          format: date-time
          description: Server time this snapshot was taken, RFC 3339 UTC.
        next_cursor:
          type: string
          nullable: true
          description: Pagination cursor when the response is partial. `null` when complete.
      additionalProperties: false

    InventoryBalancesResponse:
      type: object
      description: Current stock balances plus the cursor for the next delta.
      required:
        - branch_id
        - balances
        - cursor
        - pulled_at
      properties:
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/StockBalance'
        cursor:
          type: string
          description: Sync cursor. Pass back as `since` for an incremental pull.
          example: '2026-10-02T09:15:00Z'
        pulled_at:
          type: string
          format: date-time
          description: Server time this snapshot was taken, RFC 3339 UTC.
        next_cursor:
          type: string
          nullable: true
          description: Pagination cursor when the response is partial. `null` when complete.
      additionalProperties: false

    OrderStatus:
      type: string
      enum: [completed, void_requested, voided]
      description: |
        **SETTLEMENT STATE.** The three states an order can be *retired* into.

        This is deliberately narrower than `OrderLifecycleStatus`. A GET of a
        sale that has not settled yet cannot be answered with this enum, which is
        why `Order` carries both: `status` answers "is this sale final, and if
        not, is it being taken back?" while `lifecycle_status` answers "where in
        preparation is this sale?".

        The three values are terminal. Nothing leaves this set, so a client that
        has seen `status` can cache the order as final and never re-poll.
      example: completed

    OrderLifecycleStatus:
      type: string
      enum: [draft, submitted, in_preparation, ready, served, completed, void_requested, voided]
      description: |
        **PREPARATION LIFECYCLE.** The full eight-state ladder, kept identical to
        `local_orders.status` CHECK in
        `apps/pos-desktop/src-tauri/migrations/0001_init.sql` so that no state a
        terminal can persist is unrepresentable here.

        The last three values are exactly `OrderStatus`, which is why the settled
        enum above is a subset rather than a separate vocabulary.

        `void_requested` precedes `voided`: the terminal may ask for a void while
        offline, and the void is not an input fact until staff approve it. A
        client must not treat `void_requested` as refunded cash.
      example: in_preparation

    OrderType:
      type: string
      enum: [dine_in, takeaway, delivery]
      description: Sale type. Closed enum, matching `local_orders.type`.
      example: dine_in

    OrderSource:
      type: string
      enum: [pos_desktop, pos_mobile, admin]
      description: |
        Originating client. Lets the server attribute a back-office correction
        differently from a till sale. Matches `local_orders.source`.
      example: pos_desktop

    OrderDiscountType:
      type: string
      nullable: true
      enum: [member, promotion, manual_supervisor, staff]
      description: |
        Why the discount was applied, `null` when there was no discount.

        Closed enum on purpose: an unauthorised discount must fail validation
        rather than arrive as free text that the end-of-shift report groups under
        an unknown label. Matches `local_orders.discount_type`.
      example: member

    OrderSyncState:
      type: string
      enum: [pending, synced, conflict, rejected]
      description: |
        Delivery state of this order's sync. Mutable and **not money** — the
        terminal's money-immutability trigger must never block it.
        Matches `local_orders.sync_state`.
      example: synced

    VatRateBp:
      type: integer
      minimum: 0
      description: |
        VAT rate in BASIS POINTS, 1 bp = 0.01%. Default 700 = 7.00%.

        Basis points rather than a percentage so the rate is exact integer
        arithmetic: 7 percent is `700`, never `6.999999999`. Matches
        `local_orders.vat_rate_bp`.
      example: 700

    LoyaltyPoints:
      type: integer
      minimum: 0
      description: |
        Loyalty points earned on this sale. A count and not money, hence no
        `_satang` suffix.
      example: 12

    Order:
      type: object
      description: |
        A completed sale with its lines and its payments.

        Every `*_satang` field here is a `Satang` string (`"4550"`), **except**
        `rounding_adjustment_satang`, which is a `SignedSatang` integer because
        cash rounding is signed.

        **The money identity.** The VAT decomposition is pinned to `gross`, not
        to the total:

          gross            = subtotal_satang - discount_satang
          taxable + tax    = gross
          total_satang     = gross + service_charge_satang + rounding_adjustment_satang
          total_satang >= 0

        `taxable_satang` holds the NET — the VAT-exclusive portion extracted from
        the VAT-inclusive `gross` — which is why `taxable + tax == gross` and not
        `== total`. That distinction is what makes a **negative**
        `rounding_adjustment_satang` safe: cash rounding is a settlement of the
        tender and not consideration for goods, so it carries no VAT and never
        enters the decomposition. A receipt whose VAT halves still describe the
        goods identically whether the total was rounded up, down, or not at all.

        `0002_signed_rounding.sql` writes the third identity the long way round —
        `CHECK (taxable_satang + tax_satang = total_satang - service_charge_satang
        - rounding_adjustment_satang)` — which is algebraically identical once the
        total identity holds. Do not read the long form as implying that rounding
        participates in the VAT base; it does not.
      required:
        - id
        - branch_id
        - terminal_id
        - staff_user_id
        - type
        - status
        - lifecycle_status
        - source
        - currency_code
        - vat_rate_bp
        - subtotal_satang
        - discount_satang
        - taxable_satang
        - tax_satang
        - service_charge_satang
        - rounding_adjustment_satang
        - total_satang
        - loyalty_points_earned
        - sync_state
        - local_receipt_number
        - created_at
        - updated_at
        - lines
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        terminal_id:
          $ref: '#/components/schemas/UuidV7'
        staff_user_id:
          $ref: '#/components/schemas/UuidV7'
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        lifecycle_status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        source:
          $ref: '#/components/schemas/OrderSource'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        vat_rate_bp:
          $ref: '#/components/schemas/VatRateBp'
        subtotal_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: Sum of line totals before order-level discount.
        discount_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: Order-level discount, capped by `subtotal_satang`.
        taxable_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: The VAT base = `subtotal_satang - discount_satang`.
        tax_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            VAT in satang, derived from `taxable_satang` and `vat_rate_bp` as
            `round_half_up(gross * 10000 / (10000 + vat_rate_bp))`.

            Rounded **once per order**, never per line, which is why
            `OrderLine.line_tax_satang` is pinned to zero. Not a SQLite CHECK yet
            — the formula is marked `TODO(TAX-FORMULA)` in the migration.
        service_charge_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            Service charge. Zero when the branch has none, because a non-zero
            default is a charge nobody can explain.
        rounding_adjustment_satang:
          allOf: [$ref: '#/components/schemas/SignedSatang']
          description: |
            Satang **added or subtracted** so the total is payable in the exact
            cash and coin denominations in the drawer (Thai baht coins end in 5).

            Signed, unlike every other money field, and the only negative money
            value in this contract. See the identity caveat on this schema before
            sending a negative value.
        total_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: The amount actually charged.
        discount_type:
          $ref: '#/components/schemas/OrderDiscountType'
        loyalty_points_earned:
          $ref: '#/components/schemas/LoyaltyPoints'
        sync_state:
          $ref: '#/components/schemas/OrderSyncState'
        local_receipt_number:
          type: string
          description: |
            The number printed on the till receipt, local and monotonic per
            terminal. The server assigns the authoritative receipt number at
            sync, so this value is what the customer is holding.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.
        lines:
          type: array
          minItems: 1
          description: |
            The sale's lines. `minItems: 1` because an order with no lines has no
            meaningful total, and `total_satang` would be a rounding artefact
            rather than a price.
          items:
            $ref: '#/components/schemas/OrderLine'
        payments:
          type: array
          description: |
            Payments tendered against this order. Not in the required list
            because an order can exist, and be looked up, before payment is
            recorded — and a zero-element array is meaningfully different from an
            absent one.
          items:
            $ref: '#/components/schemas/Payment'
      additionalProperties: false

    OrderLine:
      type: object
      description: |
        One line of a sale. Names are frozen at sale time, so a later catalogue
        rename never rewrites a historical receipt.
      required:
        - id
        - order_id
        - variant_id
        - name_th
        - quantity
        - unit_price_satang
        - line_discount_satang
        - line_tax_satang
        - line_total_satang
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        order_id:
          $ref: '#/components/schemas/UuidV7'
        variant_id:
          $ref: '#/components/schemas/UuidV7'
          description: |
            Catalogue variant. A plain id and **not** a foreign key, because the
            catalogue is server-owned and a terminal must be able to record a
            sale while offline with the catalogue unavailable.
        product_id:
          allOf: [$ref: '#/components/schemas/UuidV7']
          nullable: true
          description: Denormalised parent product, `null` if not known offline.
        sku:
          type: string
          nullable: true
          description: Denormalised SKU at sale time, `null` if not known offline.
        name_th:
          type: string
          description: |
            Thai name frozen at sale time. NOT NULL because the Thai name is what
            the kitchen reads; the English name is optional.
        name_en:
          type: string
          nullable: true
          description: English name frozen at sale time.
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit_price_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            Price of ONE unit, before line discount and before tax. This is the
            VAT-INCLUSIVE menu price.
        line_discount_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            Discount applied to this line. Capped by `unit_price_satang *
            quantity`, enforced as a SQLite CHECK so a discount cannot exceed the
            line it discounts.
        line_tax_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            VAT attributable to this line. **Always `"0"`, and the terminal
            enforces `= 0` with a CHECK.**

            Not an oversight: VAT is rounded once per order, so there is no
            per-line VAT to store. A non-zero value here would be a line-level
            rounding the order-level figure does not contain, and the two would
            disagree by a satang per line — drift a tax return cannot absorb. The
            field is kept so the storage contract keeps its shape.
        line_total_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            This line's contribution to the order total =
            `unit_price_satang * quantity - line_discount_satang + line_tax_satang`.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.
      additionalProperties: false

    PaymentMethod:
      type: string
      enum: [cash, qr_promptpay]
      description: |
        How the customer paid.

        Deliberately short and closed. PromptPay is spelled `qr_promptpay` rather
        than `promptpay` because the leading `qr_` marks it as one of several
        possible QR schemes; renaming it later would be a breaking change on a
        field that is already in historical receipts.

        Card payments are absent, not forgotten: this system has no card
        terminal integration, and an enum that reserves a slot for an unimplemented
        method invites a client to render a button that cannot work.
      example: cash

    Payment:
      type: object
      description: |
        One payment tendered against an order.

        **Server-authoritative and not yet mirrored on the terminal.** There is no
        `payments` table in
        `apps/pos-desktop/src-tauri/migrations/0001_init.sql`; cash tendering is
        recorded as a field of the order. So a terminal cannot read a payment back
        from local disk, and a `Payment` only ever exists server-side after sync.
        Anything that needs to work offline must not depend on this schema.
      required: [id, order_id, amount_satang, method]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        order_id:
          $ref: '#/components/schemas/UuidV7'
        amount_satang:
          allOf: [$ref: '#/components/schemas/Satang']
          description: |
            Amount tendered in satang. Does not have to sum to
            `Order.total_satang`: an over-tender produces change, and split
            payment across several methods is legitimate.
        method:
          $ref: '#/components/schemas/PaymentMethod'
      additionalProperties: false

    SyncAggregateType:
      type: string
      enum: [order, shift, refund, void_request, receipt, stock_movement]
      description: |
        Which kind of domain object a queued event is about. Matches
        `sync_outbox.aggregate_type`.
      example: order

    SyncEventType:
      type: string
      enum:
        - order_committed
        - shift_opened
        - shift_closed
        - receipt_printed
        - refund_issued
        - void_approved
        - stock_movement_recorded
      description: |
        WHAT happened, as a closed vocabulary. Matches `sync_outbox.event_type`.

        A new event type needs a forward migration, because adding a member here
        is exactly the way a terminal's drain and the server's contract drift
        apart.
      example: order_committed

    SyncAction:
      type: string
      enum: [push_order, push_shift, pull_catalog, pull_customers, pull_settings]
      description: HOW to deliver the event. Matches `sync_outbox.action`.
      example: push_order

    SyncCommand:
      type: object
      description: |
        One drained outbox event, replayed verbatim.

        `payload` is a **JSON object, not a typed schema**. Modelling every
        payload inline would mean a new event type forces a contract change in
        lockstep with a terminal migration, which is precisely the coupling the
        outbox exists to avoid: an old terminal draining a queue written by a new
        build must be able to hand the server something the server recognises.
        The terminal CHECKs `json_valid(payload) AND json_type(payload) = 'object'`
        so at least the envelope is guaranteed here.
      required: [id, aggregate_type, aggregate_id, event_type, action, idempotency_key, payload]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        aggregate_type:
          $ref: '#/components/schemas/SyncAggregateType'
        aggregate_id:
          $ref: '#/components/schemas/UuidV7'
        event_type:
          $ref: '#/components/schemas/SyncEventType'
        action:
          $ref: '#/components/schemas/SyncAction'
        idempotency_key:
          type: string
          description: |
            Replay-safety key for the server-side dedup table, unique per
            terminal. This is the **event-level** key, distinct from the
            `Idempotency-Key` header, which dedupes the drain attempt as a whole.
        payload:
          type: object
          description: The event body, as recorded offline.
          additionalProperties: true
      additionalProperties: false

    SyncPushRequest:
      type: object
      description: |
        A batch of outbox events drained by one terminal.

        Ordered by the terminal's monotonic local `sequence`, and the contract
        preserves that order because replaying a `shift_opened` after the
        `shift_closed` that ended it would corrupt the till's day. The server
        applies commands in array order and must not reorder them.
      required: [terminal_id, commands]
      properties:
        terminal_id:
          $ref: '#/components/schemas/UuidV7'
        commands:
          type: array
          description: |
            The drained events, in local sequence order. May be empty: a drain
            that raced another drain must be a no-op success, not an error, or the
            terminal will back off against a queue it has already emptied.
          items:
            $ref: '#/components/schemas/SyncCommand'
      additionalProperties: false

    SyncCommandOutcome:
      type: string
      enum: [applied, duplicate, rejected]
      description: |
        What the server did with one command.

        `duplicate` is a **success**, not a failure: it means the command's
        `idempotency_key` was already applied, which is the normal outcome of a
        retry after a response lost in flight. A terminal must treat it as done,
        or it will retry a command the server already has forever.

        `rejected` is permanent and says the server will never take this command;
        the terminal moves it to `failed_permanent` and stops trying.
      example: applied

    SyncCommandResult:
      type: object
      description: Per-command outcome, correlated by `id`.
      required: [id, outcome]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
          description: Matches the `id` of the submitted command.
        outcome:
          $ref: '#/components/schemas/SyncCommandOutcome'
        error_code:
          type: string
          nullable: true
          description: Machine-readable reason, present only when `outcome` is `rejected`.
        error_message:
          type: string
          nullable: true
          description: |
            Human-readable reason. Must not be parsed; branch on `error_code`.
      additionalProperties: false

    SyncPushResponse:
      type: object
      description: |
        Result of one drain attempt.

        `results` is positional-by-`id`, not positional-by-index: a terminal
        drains concurrently, so it must correlate by `id` rather than assuming
        index `n` of the request came back at index `n`.
      required: [results, applied, duplicates, rejected, pushed_at]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncCommandResult'
        applied:
          type: integer
          minimum: 0
          description: Count of commands newly applied.
        duplicates:
          type: integer
          minimum: 0
          description: Count of commands already applied under this idempotency key.
        rejected:
          type: integer
          minimum: 0
          description: Count of commands the server refused permanently.
        pushed_at:
          type: string
          format: date-time
          description: Server time this batch was processed, RFC 3339 UTC.
        cursor:
          type: string
          nullable: true
          description: |
            Newest sync cursor the server holds after applying the batch. Hand it
            to the next incremental pull so the terminal does not re-fetch what
            this push already covered.
      additionalProperties: false

    Error:
      type: object
      description: |
        Error envelope. `code` is a stable machine-readable string for
        branching; `message` is for humans and must not be parsed.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: branch_not_accessible
        message:
          type: string
          description: Human-readable explanation. Not for programmatic use.
          example: This device is not registered to branch 018f3c2a-7b41-7c3d-9e10-5a2b8c4d6e01.
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional structured context.
      additionalProperties: false

    # ── Reporting (Phase 1) ───────────────────────────────────────────────────

    BranchesResponse:
      type: object
      description: |
        Response for `GET /branches`. No pagination: branches are small and
        fetched once per shift.
      required: [branches]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      additionalProperties: false

    Branch:
      type: object
      description: |
        A branch. The server's authoritative list of shops. Currently only the
        branch that holds this server's data exists, but the contract is written
        to support multiple branches in the future.
      required:
        - id
        - name
        - currency
        - vat_rate_bp
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        name:
          type: string
          description: Branch display name.
          example: Siam
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        vat_rate_bp:
          $ref: '#/components/schemas/VatRateBp'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 UTC.
      additionalProperties: false

    TerminalsResponse:
      type: object
      description: |
        Response for `GET /terminals`. No pagination: terminals are small and
        fetched once per shift.
      required: [terminals]
      properties:
        terminals:
          type: array
          items:
            $ref: '#/components/schemas/Terminal'
      additionalProperties: false

    Terminal:
      type: object
      description: |
        A terminal that has pushed orders to this server. The `id` is the
        `terminal_id` UUID (not a sequence), and `last_sync_at` is derived from
        `sync_outbox_items`.
      required:
        - id
        - last_sync_at
        - order_count
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
          description: |
            The terminal UUIDv7, derived from `orders.terminal_id` and
            `sync_outbox_items.terminal_id`.
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Latest successful sync time, derived from `MAX(processed_at)` of
            `sync_outbox_items` where `state IN ('ACKNOWLEDGED', 'CONFLICT_HELD')`.
            Null if the terminal exists only in `orders` but never pushed.
        order_count:
          type: integer
          minimum: 0
          description: Count of orders pushed by this terminal.
      additionalProperties: false

    ReportSummaryResponse:
      type: object
      description: |
        Response for `GET /reports/summary`. All monetary fields are `Satang`
        strings.
      required:
        - as_of
        - revenue_total_satang
        - vat_satang
        - order_count
        - voided_count
      properties:
        as_of:
          type: string
          format: date-time
          description: |
            Latest `created_at` of counted orders (UTC). This is the "point in
            time" for the summary — a client can resume from this timestamp.
        revenue_total_satang:
          $ref: '#/components/schemas/Satang'
          description: |
            Total revenue (VAT-inclusive), excluding draft and voided orders.
        vat_satang:
          $ref: '#/components/schemas/Satang'
          description: VAT amount extracted from revenue.
        order_count:
          type: integer
          minimum: 0
          description: Count of counted orders (excludes draft and voided).
        voided_count:
          type: integer
          minimum: 0
          description: |
            Count of orders with `status = 'voided'` within the date range.
      additionalProperties: false

    RevenueByBranchResponse:
      type: object
      description: |
        Response for `GET /reports/revenue-by-branch`.
      required: [revenue_by_branch]
      properties:
        revenue_by_branch:
          type: array
          items:
            $ref: '#/components/schemas/RevenueByBranchItem'
      additionalProperties: false

    RevenueByBranchItem:
      type: object
      description: |
        Revenue and order count for one branch.
      required:
        - branch_id
        - name
        - revenue_satang
        - order_count
      properties:
        branch_id:
          $ref: '#/components/schemas/UuidV7'
        name:
          type: string
          description: Branch name.
        revenue_satang:
          $ref: '#/components/schemas/Satang'
        order_count:
          type: integer
          minimum: 0
      additionalProperties: false

    RevenueSeriesResponse:
      type: object
      description: |
        Response for `GET /reports/revenue-series`.
      required: [series]
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/RevenueSeriesItem'
      additionalProperties: false

    RevenueSeriesItem:
      type: object
      description: |
        Revenue and order count for one time bucket (day or month).
      required:
        - bucket
        - revenue_satang
        - order_count
      properties:
        bucket:
          type: string
          description: |
            ISO 8601 bucket identifier: `YYYY-MM-DD` for day, `YYYY-MM` for month.
            Dates are interpreted in `Asia/Bangkok` timezone.
          example: '2026-10-01'
        revenue_satang:
          $ref: '#/components/schemas/Satang'
        order_count:
          type: integer
          minimum: 0
      additionalProperties: false
