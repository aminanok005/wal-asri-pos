# GreenTable POS - integration gate.
#
# Protects the contract between the committed lockfile, the workspace type
# surface, the test suite, and the production bundle. Every step below is
# already known to pass on this machine, so a red run means something changed -
# not that the harness itself is broken.

name: Verify lockfile, types, tests and bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This gate is minutes, not tens of minutes, so a superseded run is pure waste:
# it would race the newer run for the same apps/pos-desktop/dist/ and the same
# caches. Keyed on github.ref so cancellation is per-branch and PR runs on
# different refs do not cancel each other.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this gate only ever reads the repository. Nothing here
# pushes, comments, or opens a PR, so no write scopes are granted.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    # Minutes, not tens of minutes. The 6-hour default suits long suites; here
    # it would let a hung tsc or vite hold a branch hostage for hours. 15 is
    # generous headroom over the observed runtime.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun 1.3.14 (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          # EXACT pin, and it is the load-bearing choice in this file. The Bun
          # workspace note in SKILL.md (section 3.5) records that Bun 1.4+ writes
          # bun.lock with lockfileVersion: 2, while 1.3.x writes version 1 - the
          # format actually committed here. A runner on a newer Bun would rewrite
          # the lockfile to a format the local toolchain does not expect and can
          # lose the workspace graph, so this mirrors the root
          # "packageManager": "bun@1.3.14" exactly. Do not float it to latest,
          # ^1.3.14 or 1.x.
          bun-version: 1.3.14

      - name: Install Node 22 (pinned)
        uses: actions/setup-node@v4
        with:
          # setup-bun does not install Node, and ubuntu-latest does not
          # guarantee a Node new enough for Vite 7, which requires
          # ^20.19.0 || >=22.12.0. The root engines.node floor of >=20.0.0 is
          # looser than the build step actually needs - it still admits the
          # 20.19-21.x range Vite 7 rejects - so it cannot keep a runner safe.
          # Hence 22, pinned rather than ranged.
          #
          # No cache: on purpose. setup-node's cache is npm/yarn oriented; this
          # repo installs with Bun, and Bun's install cache is handled by the
          # actions/cache step below.
          node-version: 22

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          # Keyed on bun.lock because a lockfile change is exactly the event
          # that invalidates the downloaded tarballs. A key on anything coarser
          # either wastes the cache on every unrelated commit or keeps serving a
          # stale one; nothing finer would ever hit.
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          # The download cache only - never node_modules/. Restoring an installed
          # tree would hide a drifted or broken lockfile instead of surfacing it,
          # which is the opposite of what a guard rail is for.
          path: ~/.bun/install/cache

      - name: Install dependencies (frozen lockfile)
        # From the repository root, which is where bun.lock lives.
        # --frozen-lockfile is the whole point: it fails the run when bun.lock
        # disagrees with any package.json, which is precisely the drift this gate
        # exists to catch, and it is what makes restoring the download cache
        # above safe. Without it CI would happily install a different dependency
        # graph than the one that was locked and reviewed.
        run: bun install --frozen-lockfile

      # WHY THIS IS NOT `bun run verify`
      #
      # `bun run verify` is the DEVELOPER-facing gate: typecheck, TS tests, the
      # Rust suite, and (since the Go backend landed) `go test ./...`. On a
      # developer machine that is exactly right — one command, everything green.
      #
      # In CI it is the wrong shape. This job runs on a 15-minute budget with NO
      # cargo cache, and `bun run verify` would now pull `cargo test --locked`
      # into it — recompiling the bundled-sqlcipher C amalgamation from scratch
      # in a second job, on top of the `rust` job that already does it with a
      # warm cache. That is several minutes of duplicated C compilation and a
      # real chance of tripping this job's timeout for no added coverage.
      #
      # So the gates are split by job and run in parallel instead:
      #   this job    -> typecheck + TS tests + the production bundle
      #   rust job    -> cargo check + cargo test  (see below)
      #   backend job -> go vet + go test          (see below)
      #
      # The invariant that matters — "what `bun run verify` runs locally is what
      # CI runs" — is maintained by the job list below, not by calling the
      # aggregate script. If a new gate is added to `verify`, it needs a job here
      # too, and the `NOTE` at the foot of this file says so.
      - name: Typecheck and test (all workspaces)
        run: bun run typecheck && bun run test

      # Kept separate from verify so a red run names the step that broke. Build
      # runs after verify, not before: a bundle produced from code that does not
      # typecheck or pass its tests is not evidence of anything.
      - name: Build (all workspaces)
        run: bun run build

  # --- Rust ---------------------------------------------------------------------
  #
  # The checkout money path is only half TypeScript. `save_offline_order` in
  # apps/pos-desktop/src-tauri/src/commands.rs opens the SQLCipher database and
  # writes the order, its lines and the outbox event in ONE transaction — the
  # §2.2 offline guarantee. The migrations that encode the VAT rules are applied
  # by that same crate, and the SQL-level tests in migrations.test.ts attack
  # 0001_init.sql through bun:sqlite.
  #
  # Those two facts are exactly why this is a REQUIRED job and not an optional
  # extra. migrations.test.ts proves the constraints are correct; only
  # `cargo test` proves the Rust that must satisfy them actually does. A change
  # that quietly broke save_offline_order — wrong column order, a transaction
  # that stopped rolling back, an IPC struct whose field names no longer match
  # what the TypeScript sends — would leave the JS suite entirely green.
  rust:
    name: Check and test the native crate
    runs-on: ubuntu-latest
    # cargo check on a cold cache including the bundled-sqlcipher C build is the
    # slow part; 25 leaves headroom without letting a hung build hold a PR.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match the local toolchain (rustc 1.98.1) so a difference in the
      # compiler is never mistaken for a difference in the code. This is also the
      # version the 36 Rust tests were last observed green on.
      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # `bundled-sqlcipher` compiles C from source (libsqlite3 + the crypto
      # backend). Without build-essential the build fails with an opaque
      # "cc not found", which reads like a dependency problem rather than a
      # missing compiler.
      - name: Install build tools for the bundled SQLCipher
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Proves the C toolchain is actually USABLE, rather than merely installed.
      # Without this the first sign of a missing compiler is "linker `cc` not
      # found" deep inside a rusqlite build, which reads like a broken
      # dependency rather than the toolchain problem it is. Cheap, and it turns
      # an opaque failure into a named one.
      - name: Verify the C toolchain
        run: |
          cc --version
          echo "C compiler target: $(cc -dumpmachine)"

      # Caches target/ keyed on the lockfile. The crate's own dependencies are
      # pinned by Cargo.lock; the cache is an optimisation, never the thing that
      # makes the build reproducible.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: apps/pos-desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/pos-desktop/src-tauri/Cargo.lock') }}

      # --locked makes Cargo refuse to update Cargo.lock. Without it a build
      # could silently resolve different dependency versions than the ones
      # committed and reviewed, which is the same failure mode the frozen
      # Bun lockfile guard above exists to prevent.
      - name: cargo check
        working-directory: apps/pos-desktop/src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: apps/pos-desktop/src-tauri
        run: cargo test --locked

  # --- The Go backend ---------------------------------------------------------
  #
  # Added because `bun run verify` came to include `go test ./...`, and the
  # `verify` job above no longer runs that aggregate script (see the note on its
  # test step). Without this job the Go backend would have NO CI coverage at
  # all: `go test` would pass on a laptop and never run on a pull request.
  #
  # Named `backend` rather than `go` because it gates the whole Go monolith, not
  # the language: it is the sync outbox engine, the order ingest pipeline and the
  # money kernel. A future second Go service would be a separate job with its own
  # name, and a language-named job would read as "the Go tests" rather than "this
  # service".
  #
  # Now the largest Go job: it runs the money rules AND the persistence layer
  # against a real PostgreSQL, which is the only place the schema's CHECKs are
  # actually exercised. Everything else about that service — Redis, the shift
  # ledger — is separate work with its own tests.
  backend:
    name: Test the Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/api-backend

    # ── The PostgreSQL the integration tests run against ────────────────────
    #
    # WHY A REAL DATABASE AND NOT A MOCK. The whole point of
    # db/migrations/0001_orders.sql is that the money invariants are re-derived as
    # CHECK constraints, so that a bug fails at COMMIT regardless of which layer
    # produced the row. A mock reproduces the queries and none of the constraints,
    # so a test against one is evidence about the Go code and silence about the
    # schema — and the schema is the part most likely to be wrong.
    #
    # The port is 5433, mirroring docker-compose.yml and dev/DEV-SETUP.md. This is
    # not cosmetic: 5432 is the SIBLING project `pos-walasri`'s port, and the three
    # layers that keep the projects apart (containerd namespace, container name,
    # host port) exist precisely so a typo cannot reach someone else's database.
    # Publishing on 5433 here means the DSN is byte-identical to the local one, so
    # the same command works on a laptop and on a runner with nothing to rewrite.
    #
    # These credentials are NOT secrets. They are the throwaway local-development
    # values already committed in docker-compose.yml, and this container is
    # created fresh for this job and destroyed with it. Nothing sensitive is
    # reachable through them.
    services:
      postgres:
        image: postgres:16
        # Same major version as docker-compose.yml. A CHECK that passes on 15 and
        # fails on 16 is a schema bug, and a schema bug found by CI on a version
        # nobody develops on is the worst way to find one.
        env:
          POSTGRES_DB: walasri_db
          POSTGRES_USER: wasri_user
          POSTGRES_PASSWORD: walasri_local_dev_pw
          # Mirrors docker-compose.yml: deterministic collation, so ORDER BY does
          # not vary between a runner and a developer's machine.
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5433:5432
        # LOAD-BEARING for stability. Without a health check the job starts as soon
        # as the container is CREATED, which is not the same as Postgres accepting
        # connections — initdb has still got to run. The result is a suite that is
        # green on a warm runner and red on a cold one, intermittently, which is the
        # worst failure mode a gate can have because it teaches people to re-run.
        # `pg_isready` is the container's own probe, so this waits for the database
        # rather than for a process.
        options: >-
          --health-cmd "pg_isready -U wasri_user -d walasri_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `go-version-file` reads the `go` directive straight out of the module's
      # own go.mod, so the CI toolchain tracks the module instead of drifting
      # from a copy-pasted number. `go.mod` here declares `go 1.25`.
      #
      # `cache: false` is LOAD-BEARING, and it was a real red build before it was
      # set.
      #
      # `actions/setup-go@v5` enables caching by DEFAULT (action.yml: `cache`
      # default `true`), and its `src/cache-restore.ts` resolves the dependency
      # file like this:
      #
      #   findDependencyFile()  ->  fs.readdirSync(GITHUB_WORKSPACE) and looks
      #                             for `go.sum` in the REPOSITORY ROOT
      #   if (!goSumFileExists) ->  throw `Dependencies file is not found in ...`
      #
      # There is no `go.sum` anywhere in this repo, and there cannot be one: the
      # module declares `go 1.25` with NO require block, so it depends only on the
      # standard library. The step therefore threw on its first run and took the
      # whole job red before a single Go test executed.
      #
      # Note what did NOT protect it: simply omitting `cache-dependency-path`.
      # Leaving it unset makes `findDependencyFile` run and throw, rather than
      # skipping the lookup — omitting the input is not the same as disabling the
      # feature. Only `cache: false` actually turns it off.
      #
      # Disabling is also correct on the merits, not merely as a workaround: with
      # zero external modules there is nothing to download, so a module cache
      # would be pure overhead keyed on a file that does not exist.
      #
      # When the first real dependency lands and `go.sum` is committed, flip this
      # to `cache: true` and add
      # `cache-dependency-path: services/api-backend/go.sum` IN THE SAME COMMIT —
      # note the path, because the action looks in the repository ROOT by default
      # and a module nested one level down is not where it expects to find it.
      - name: Install Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api-backend/go.mod
          cache: false

      # `go vet` before `go test`: vet catches a class of mistake a unit test
      # cannot (unreachable code, a printf verb that does not match its
      # argument) and costs seconds. Running it first means those failures are
      # reported as themselves rather than as an opaque test failure later.
      #
      # Kept as its own step rather than chained with `&&`. GitHub renders a failed
      # step by name, so a red run says "go vet" or "go test" outright instead of
      # one merged line — which matters here, because the two failures mean
      # different things: vet failing is usually a mistake in the code, while a
      # test failing in `money` or `sync` means a money rule moved.
      - name: go vet
        run: go vet ./...

      # `-v` so the log names every test that ran. It costs about 130 lines
      # against the suite's size, and it is worth it on this service specifically:
      # when a money identity or an idempotency decision starts failing, the first
      # question is always "which tests actually executed", and a bare `ok` line
      # answers nothing.
      #
      # `-tags=integration` unlocks the persistence suite in
      # internal/order/adapter/postgres, which is guarded by that build tag so it
      # never runs where there is no database.
      #
      # Build tags are ADDITIVE, which is why this is one command rather than two:
      # `-tags=integration` does not select the tagged files INSTEAD OF the untagged
      # ones, it compiles them as well. So this single command runs the whole
      # suite — 127 untagged tests plus the 6 integration ones, 133 in total —
      # and there is no second invocation to forget.
      #
      # `WASRI_TEST_DATABASE_URL` points at the service container above. The
      # integration tests SKIP when it is unset, so the suite degrades to "unit
      # tests only" rather than to a red build — which is the safe direction to
      # fail, but it does mean a typo in this URL would silently reduce coverage
      # instead of breaking loudly. The SKIP assertion below is what catches that.
      #
      # The suite runs ONCE here, not twice: the assertion step used to re-run
      # `go test` purely to grep its own output, doubling the wall-clock and the
      # DB round-trips against a live database for no added signal.
      #
      # It asserts on the tests BY NAME rather than on a total count, for two
      # reasons. A global count rots — adding an unrelated test changes it, and
      # whoever adds one will not think to edit a magic number in this file, so it
      # decays into a constant that means nothing. And a count cannot say WHICH
      # tests ran, which is the only thing worth knowing here: someone reading a
      # green run needs to be able to conclude that the money CHECKs were
      # exercised, not merely that a lot of tests passed.
      #
      # A new integration test must be added to the six names below in the same
      # commit that adds it, or this gate stops proving that test actually ran.
      - name: go test (unit + integration, run once and asserted)
        env:
          WASRI_TEST_DATABASE_URL: >-
            postgres://wasri_user:walasri_local_dev_pw@127.0.0.1:5433/walasri_db?sslmode=disable
        run: |
          set -euo pipefail
          output="$(go test -count=1 -v -tags=integration ./... 2>&1)" || {
            echo "$output"
            exit 1
          }
          printf '%s\n' "$output"

          skipped="$(printf '%s\n' "$output" | grep -cE '^(--- SKIP|    --- SKIP)' || true)"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::${skipped} test(s) SKIPPED. The database was unreachable, so the schema's" \
                 "CHECK constraints and the whole persistence layer went untested and this gate" \
                 "would have passed while proving nothing. Check the service container above."
            printf '%s\n' "$output" | grep -E '^(--- SKIP|    --- SKIP)' || true
            exit 1
          fi

          missing=0
          for t in \
            TestMigrate_IsIdempotent \
            TestOrderRepository_RoundTripsAnOrderWithNegativeCashRounding \
            TestOrderRepository_RefusesADuplicateID \
            TestOrderRepository_TheDatabaseRefusesABalancedButWrongTotal \
            TestIngestOrder_PersistsToPostgresAndDeduplicatesOnRetry \
            TestBranchRate_AnUnratedBranchIsAnErrorNotADefault
          do
            if ! printf '%s\n' "$output" | grep -qE "^--- PASS: ${t}([[:space:]]|$)"; then
              echo "::error::integration test ${t} did not run (or did not pass). The persistence" \
                   "layer was not exercised, so the money CHECKs in db/migrations are untested."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          total="$(printf '%s\n' "$output" | grep -cE '^(--- PASS|    --- PASS)' || true)"
          echo "all 6 integration tests ran against PostgreSQL; ${total} tests passed in total"

# --- Deliberate omissions, so the next reader does not "fix" them -------------
#
# No `bun run generate:types`. The generated types in
# packages/api-types/src/index.ts are committed; regenerating them in CI would
# be either a no-op or a diff CI cannot act on. `typecheck` already consumes
# them.
#
# No `bun run infra:up` / docker / nerdctl. The suite is pure JS/TS and the
# migrations test drives bun:sqlite against an in-memory database, so nothing
# depends on Postgres or Redis. A compose step would add a failure mode with no
# test behind it. The Rust job needs no database either: its tests open their
# own in-memory SQLCipher connection. The backend job likewise needs none — it has
# no Postgres driver to talk to and its tests run against in-memory ports and
# httptest, which is the only reason its suite is this fast.
#
# `bun run verify` is not called by any job. That is deliberate and is the one
# thing a future editor is most likely to "fix" back: the aggregate script runs
# the Rust and Go suites too, and calling it from the `verify` job would
# recompile the bundled-sqlcipher C amalgamation a second time in a job with no
# cargo cache, against a 15-minute budget, duplicating the `rust` job for no
# extra coverage. The gates are split across jobs on purpose.
#
# The consequence: the job list here, not the script, defines CI. If a gate is
# added to `bun run verify`, it needs a job in this file as well or it will only
# ever run on a developer's machine.
#
# No matrix over Bun or Node versions. One pinned toolchain is this gate; drift
# testing is a separate piece of work.
